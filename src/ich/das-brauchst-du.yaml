# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title:
  de: Das brauchst du hier
  en: What you need here
description:
  de: "Kurz wiederholt: Informatiksysteme im Alltag, KI im Alltag und wie eine Maschine aus Beispielen lernt."
  en: "A short recap: computer systems in everyday life, AI in everyday life and how a machine learns from examples."
recap: [informatik/informatiksysteme-im-alltag, informatik/ki-im-alltag, informatik/maschinelles-lernen]
blocks:
  - type: section
    id: einstieg
    title:
      de: Kannst du das schon?
      en: Can you do this already?
    blocks:
      - type: text
        text:
          de: |
            In diesem Kapitel erlebst du mit der Klasse 6b drei Fälle aus der digitalen Welt. Dafür brauchst du drei
            Dinge aus anderen Kapiteln. Prüfe dich kurz selbst:

            - **Informatiksysteme im Alltag:** Ich kann Informatiksysteme in meinem Alltag erkennen, zum Beispiel
              Smartphone, Spielkonsole oder Kasse.
            - **KI im Alltag:** Ich kann Beispiele für künstliche Intelligenz aus meinem Alltag nennen, zum Beispiel
              Empfehlungen, Sprach- oder Bilderkennung.
            - **Maschinelles Lernen:** Ich kann an einem Beispiel erklären, dass ein KI-System aus Beispieldaten
              Muster lernt, statt dass jemand jede Regel programmiert.
          en: |
            In this chapter you meet three cases from the digital world with class 6b. For this you need three things
            from other chapters. Check yourself quickly:

            - **Computer systems in everyday life:** I can spot computer systems in my everyday life, for example a
              smartphone, a game console or a till.
            - **AI in everyday life:** I can give examples of artificial intelligence from my everyday life, for
              example recommendations, speech or image recognition.
            - **Machine learning:** I can explain with an example that an AI system learns patterns from example data,
              instead of someone programming every rule.
  - type: section
    id: beispiel
    title:
      de: Jonas Smartphone und der Trainingsbeutel
      en: Jona's smartphone and the training bag
    blocks:
      - type: labelled-figure
        image: images/wiederholung.svg
        source: { de: "eigene Zeichnung, Oliver Jägle", en: "own drawing, Oliver Jägle" }
        licence: CC-BY-4.0
        alt:
          de: Links Jona mit einem Smartphone in der Hand. Rechts ein Stoffbeutel, aus dem zwei Tierkarten ragen.
          en: On the left Jona with a smartphone in hand. On the right a cloth bag with two animal cards sticking out.
        caption:
          de: Jona mit dem Smartphone und daneben der Trainingsbeutel.
          en: Jona with a smartphone, and next to it the training bag.
        labels:
          - { x: 30, y: 62, marker: A, text: { de: Smartphone, en: smartphone } }
          - { x: 70, y: 55, marker: B, text: { de: Trainingsbeutel, en: training bag } }
      - type: text
        text:
          de: |
            Jona ist 11 und geht in die Klasse 6b, wie Selin und Mia. Jonas Smartphone ist ein **Informatiksystem**: In
            ihm arbeitet ein Computer nach Programmen. Manche Programme darin nutzen **KI**, etwa die Foto-App, die
            Tiere erkennt.

            So eine KI hat aus vielen Beispielen gelernt. Stell dir einen Stoffbeutel voller Tierkarten vor, den
            **Trainingsbeutel**. Auf jeder Karte steht, ob ein Hund oder eine Katze darauf ist. Die Maschine findet
            Muster in diesen Beispielen. Darum gilt: **Was in den Beutel kommt, bestimmt, was herauskommt.**
          en: |
            Jona is 11 and in class 6b, like Selin and Mia. Jona's smartphone is a **computer system**: a computer inside
            it works by following programs. Some programs on it use **AI**, such as the photo app that recognises
            animals.

            An AI like this has learned from many examples. Imagine a cloth bag full of animal cards, the **training
            bag**. Each card says whether it shows a dog or a cat. The machine finds patterns in these examples. So:
            **What goes into the bag decides what comes out.**
      - type: single-choice
        id: nur-katzen
        text:
          de: Im Trainingsbeutel sind nur Karten mit Katzen. Was passiert, wenn die Maschine einen Hund sieht?
          en: The training bag only holds cards with cats. What happens when the machine sees a dog?
        options:
          - text: { de: Sie nennt ihn wahrscheinlich eine Katze., en: It probably calls it a cat. }
            correct: true
            info:
              de: Sie kennt nur Katzen als Beispiele. Etwas anderes kann sie nicht sagen.
              en: It only knows cats as examples. It cannot say anything else.
          - text: { de: Sie erkennt ihn als Hund., en: It recognises it as a dog. }
            correct: false
            info:
              de: Dafür bräuchte sie Hunde als Beispiele im Beutel. Es sind aber nur Katzen drin.
              en: For that it would need dogs as examples in the bag. But there are only cats in it.
          - text: { de: "Sie fragt einen Menschen, was das ist.", en: "It asks a person what it is." }
            correct: false
            info:
              de: Die Maschine fragt nicht von selbst. Sie antwortet mit dem, was sie aus den Beispielen gelernt hat.
              en: The machine does not ask by itself. It answers with what it learned from the examples.
        explanation:
          de: Was in den Beutel kommt, bestimmt, was herauskommt. Mit nur Katzen als Beispielen sagt die Maschine immer „Katze“.
          en: What goes into the bag decides what comes out. With only cats as examples, the machine always says “cat”.
      - type: text
        text:
          de: "Jetzt geht es los: Im ersten Fall sucht Selin ein Bild für ein Plakat. Wem gehört eigentlich ein Bild aus dem Netz?"
          en: "Now it starts: in the first case Selin looks for a picture for a poster. Who does a picture from the internet actually belong to?"
