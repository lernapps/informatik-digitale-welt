# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title:
  de: Wem gehört das Bild?
  en: Who does the picture belong to?
description:
  de: "Werk, Urheberin und Urheberrecht: Wer etwas selbst geschaffen hat, entscheidet, was damit passieren darf."
  en: "Work, creator and copyright: whoever made something decides what may happen to it."
competencies: [urheberrecht]
blocks:
  - type: section
    id: einstieg
    title:
      de: "Fall 1: Ein Foto aus dem Netz"
      en: "Case 1: A photo from the internet"
    blocks:
      - type: labelled-figure
        image: images/plakat-szene.svg
        source: { de: "eigene Zeichnung, Oliver Jägle", en: "own drawing, Oliver Jägle" }
        licence: CC-BY-4.0
        alt:
          de: Links Selin mit einem Tablet, darauf ein Foto von einem See. In der Mitte ein Plakat mit einem leeren Rahmen und einem gemalten Zug. Rechts Mia mit einem Stift.
          en: On the left Selin with a tablet showing a photo of a lake. In the middle a poster with an empty frame and a painted train. On the right Mia with a pen.
        caption:
          de: Links Selin, rechts Mia, in der Mitte ihr Plakat für die Klassenfahrt zum Seeberg.
          en: Selin on the left, Mia on the right, and in the middle their poster for the class trip to the Seeberg.
        labels:
          - { x: 26, y: 60, marker: A, text: { de: Foto aus der Bildersuche, en: photo from a picture search } }
          - { x: 58, y: 64, marker: B, text: { de: Mias Zeichnung, en: Mia's drawing } }
      - type: text
        text:
          de: |
            Die Klasse 6b fährt zum Seeberg, einem Berg an einem See. In der 6b sind auch Tom, Lea, Ben und Ali. Selin und Mia machen ein Plakat zur Klassenfahrt. Mia hat einen Zug gemalt. Selin
            findet mit der Bildersuche ein schönes Foto vom See. Ein Klick, und es ist auf ihrem Tablet. Selin und Mia erleben hier einen **Fall**: eine Lage, in der du entscheiden musst, was okay ist.

            Auf dieser Seite lernst du, wem ein Bild gehört und was das Urheberrecht schützt.
          en: |
            Class 6b is going on a trip to the Seeberg, a hill by a lake (“See” means lake, “Berg” means hill). Tom, Lea, Ben and Ali are in class 6b too. Selin and Mia are making a poster about the trip. Mia has painted a
            train. Selin finds a nice photo of the lake with a picture search. One click, and it is on her tablet. Selin and Mia are in a **case**: a situation where you have to decide what is okay.

            On this page you learn who a picture belongs to and what copyright protects.
      - type: single-choice
        id: wem-gehoert-das-foto
        text:
          de: Selin hat das Foto auf ihrem Tablet. Wem gehört das Foto?
          en: Selin has the photo on her tablet. Who does the photo belong to?
        options:
          - text: { de: "der Person, die es fotografiert hat", en: "the person who took it" }
            correct: true
            info:
              de: Wer das Foto gemacht hat, hat es geschaffen, auch wenn es im Netz steht.
              en: Whoever took the photo created it, even when it is on the internet.
          - text: { de: "Selin, weil es jetzt auf ihrem Tablet ist", en: "Selin, because it is on her tablet now" }
            correct: false
            info:
              de: Selin hat nur eine Kopie geladen. Gemacht hat sie das Foto nicht.
              en: Selin has only loaded a copy. She did not take the photo.
          - text: { de: "allen, weil es im Internet steht", en: "everyone, because it is on the internet" }
            correct: false
            info:
              de: Im Internet kann jeder das Foto sehen. Es gehört deshalb aber nicht allen.
              en: On the internet anyone can see the photo. But that does not make it belong to everyone.
        explanation:
          de: Ein Foto gehört der Person, die es gemacht hat. Laden oder Ansehen ändert daran nichts.
          en: A photo belongs to the person who took it. Loading or looking at it does not change that.
  - type: section
    id: idee
    title:
      de: Werk, Urheberin, Urheberrecht
      en: Work, creator, copyright
    blocks:
      - type: definition
        term: { de: Werk, en: work }
        explanation:
          de: Etwas, das ein Mensch selbst geschaffen hat, mit eigenen Ideen. Zum Beispiel ein Text, ein Lied, ein Bild, ein Foto, ein Film oder ein Computerprogramm.
          en: Something a person has made themselves, with their own ideas. For example a text, a song, a picture, a photo, a film or a computer program.
      - type: definition
        term: { de: Urheberin oder Urheber, en: creator }
        explanation:
          de: Die Person, die ein Werk geschaffen hat.
          en: The person who made a work.
      - type: definition
        term: { de: Urheberrecht, en: copyright }
        explanation:
          de: Das Recht der Urheberin über ihr Werk. Sie entscheidet, wer es kopieren, weitergeben, öffentlich zeigen oder ins Internet stellen darf.
          en: The creator's right over her work. She decides who may copy it, pass it on, show it in public or put it online.
      - type: table
        caption:
          de: Werke rund um die Klasse 6b und wer sie geschaffen hat
          en: Works around class 6b and who made them
        header:
          - { de: Werk, en: Work }
          - { de: Art, en: Kind }
          - { de: Urheberin oder Urheber, en: Creator }
        rowHeaders: true
        rows:
          - - { de: das Foto vom See, en: the photo of the lake }
            - { de: Foto, en: photo }
            - { de: die Fotografin, en: the photographer }
          - - { de: der gemalte Zug, en: the painted train }
            - { de: Bild, en: picture }
            - { de: Mia, en: Mia }
          - - { de: das Lied „Seeberg-Blues“, en: "the song “Seeberg Blues”" }
            - { de: Musik, en: music }
            - { de: Tom, en: Tom }
      - type: note
        title: { de: Merke, en: Remember }
        blocks:
          - type: text
            text:
              de: |
                **Auch du bist Urheberin oder Urheber**, wenn du etwas selbst malst, schreibst oder komponierst. Dein
                Alter spielt keine Rolle.

                **Was im Internet steht, gehört trotzdem jemandem.** Ansehen darfst du es. Für mehr brauchst du meistens die Erlaubnis der Urheberin. Für den Unterricht gibt es eine Ausnahme, mehr dazu auf der nächsten Seite.
              en: |
                **You are a creator too** when you paint, write or compose something yourself. Your age does not
                matter.

                **What is on the internet still belongs to someone.** You may look at it. For more, you usually need the creator's permission. There is an exception for lessons; more on the next page.
  - type: section
    id: uebung
    title:
      de: Übung
      en: Practice
    blocks:
      - type: matching
        id: wer-ist-urheber
        text:
          de: Wer ist die Urheberin oder der Urheber? Ordne zu.
          en: Who is the creator? Match them up.
        pairs:
          - left: { de: ein Aufsatz von Lea über Leas Katze, en: an essay by Lea about Lea's cat }
            right: { de: Lea, en: Lea }
          - left: { de: "ein Foto, das Ben von Ali gemacht hat", en: "a photo that Ben took of Ali" }
            right: { de: Ben, en: Ben }
          - left:
              {
                de: "ein Spiel, das zwei Programmiererinnen geschrieben haben",
                en: "a game that two programmers wrote",
              }
            right: { de: die zwei Programmiererinnen, en: the two programmers }
        distractors:
          - { de: "Ali, weil Ali auf dem Foto ist", en: "Ali, because Ali is in the photo" }
        hint:
          de: "Frag bei jedem Werk: Wer hat es geschaffen? Nicht: Wer ist darauf zu sehen?"
          en: "For each work, ask: who made it? Not: who can be seen in it?"
        explanation:
          de: Urheber ist, wer das Werk geschaffen hat. Wer auf einem Foto zu sehen ist, hat das Foto nicht gemacht.
          en: The creator is whoever made the work. Someone who can be seen in a photo did not take the photo.
      - type: multiple-choice
        id: was-ist-ein-werk
        text:
          de: Was davon ist ein Werk? Wähle alle passenden aus.
          en: Which of these are works? Choose all that fit.
        options:
          - text: { de: Toms Lied „Seeberg-Blues“, en: "Tom's song “Seeberg Blues”" }
            correct: true
            info:
              de: Tom hat das Lied mit eigenen Ideen geschaffen. Es ist ein Werk der Musik.
              en: Tom made the song with Tom's own ideas. It is a work of music.
          - text: { de: ein Computerprogramm für eine Spiele-App, en: a computer program for a game app }
            correct: true
            info:
              de: Auch ein Programm ist ein Werk. Die Menschen, die es geschrieben haben, sind seine Urheber.
              en: A program is a work too. The people who wrote it are its creators.
          - text:
              {
                de: "die Tatsache, dass die Klassenfahrt am Montag beginnt",
                en: "the fact that the class trip starts on Monday",
              }
            correct: false
            info:
              de: Eine Tatsache hat niemand mit eigenen Ideen geschaffen. Sie ist kein Werk.
              en: Nobody made a fact with their own ideas. It is not a work.
          - text: { de: der Seeberg selbst, en: the Seeberg itself }
            correct: false
            info:
              de: Der Berg ist Natur. Ein Foto vom Berg ist aber geschützt.
              en: The mountain is nature. But a photo of the mountain is protected.
        explanation:
          de: Ein Werk hat ein Mensch mit eigenen Ideen geschaffen, zum Beispiel ein Lied oder ein Programm. Tatsachen und Natur sind keine Werke.
          en: A person made a work with their own ideas, for example a song or a program. Facts and nature are not works.
      - type: number
        id: wie-viele-entscheidet-mia
        text:
          de: "Wer darf Mias Bild kopieren? Wer darf es ins Internet stellen? Wer darf es verkaufen? Bei wie vielen dieser drei Fragen entscheidet Mia?"
          en: "Who may copy Mia's picture? Who may put it online? Who may sell it? For how many of these three questions does Mia decide?"
        answer: 3
        tolerance: 0
        mistakes:
          - answer: 2
            message:
              de: Schau noch einmal auf die Erklärung „Urheberrecht“. Kopieren, weitergeben und ins Internet stellen gehören alle dazu.
              en: Look again at the explanation “copyright”. Copying, passing on and putting online all belong to it.
          - answer: 0
            message:
              de: Mia hat das Bild geschaffen. Darum entscheidet sie über ihr Werk, auch wenn sie erst 11 ist.
              en: Mia made the picture. So she decides about her work, even though she is only 11.
        hint:
          de: Lies noch einmal, was die Urheberin entscheidet.
          en: Read again what the creator decides.
        explanation:
          de: "Mia entscheidet alle drei Dinge: kopieren, ins Internet stellen und verkaufen."
          en: "Mia decides all three things: copying, putting online and selling."
      - type: single-choice
        id: ben-kopiert
        text:
          de: Ben findet Mias Zug toll. Ben kopiert ihn und hängt die Kopie mit Bens Namen im Klassenzimmer auf. Was ist daran falsch?
          en: Ben loves Mia's train. Ben copies it and puts up the copy with Ben's name on it in the classroom. What is wrong with that?
        options:
          - text: { de: Mia hat es nicht erlaubt und wird nicht genannt., en: Mia has not allowed it and is not named. }
            correct: true
            info:
              de: Mia ist die Urheberin. Sie entscheidet über ihr Bild, und es ist ihr Werk, nicht Bens.
              en: Mia is the creator. She decides about her picture, and it is her work, not Ben's.
          - text: { de: "Nichts, weil Ben es nicht verkauft.", en: "Nothing, because Ben does not sell it." }
            correct: false
            info:
              de: Auch ohne Verkauf entscheidet Mia, wer ihr Bild kopiert und zeigt.
              en: Even without a sale, Mia decides who copies and shows her picture.
          - text: { de: "Nichts, weil Kinder keine Urheber sind.", en: "Nothing, because children are not creators." }
            correct: false
            info:
              de: Auch Kinder sind Urheber. Das Alter spielt keine Rolle.
              en: Children are creators too. Age does not matter.
        explanation:
          de: Wer ein fremdes Werk kopiert und als eigenes zeigt, handelt gegen das Recht der Urheberin. Ben müsste Mia fragen und Mia nennen.
          en: Whoever copies someone else's work and shows it as their own goes against the creator's right. Ben would have to ask Mia and name Mia.
      - type: text
        text:
          de: "Das Foto vom See gehört also nicht Selin. Die Bildersuche zeigt Selin noch zwei andere Fotos vom See. Darf sie eines davon für das Plakat nehmen? Das klärst du auf der nächsten Seite."
          en: "So the photo of the lake does not belong to Selin. The picture search shows Selin two more photos of the lake. May she use one of them for the poster? You find out on the next page."
