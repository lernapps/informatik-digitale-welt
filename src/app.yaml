# yaml-language-server: $schema=../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
format: 2
strand: informatik/gesellschaft
title:
  de: "Leben in der digitalen Welt: Fälle und Urteile"
  en: "Life in the digital world: cases and judgements"
intro:
  de: >-
    Jona, Selin und Mia, alle 11, aus der Klasse 6b erleben Fälle aus der digitalen Welt: ein Foto aus dem Netz für ein
    Plakat, einen Berufsbesuch und eine KI, die Hausaufgaben schreiben kann. Du lernst, was du mit fremden Werken tun
    darfst, wo Informatik in Alltag und Beruf steckt und welche Chancen und Risiken KI hat. Am Ende jedes Falls fällst
    du dein eigenes Urteil auf der Urteilsskala.
  en: >-
    Jona, Selin and Mia, all aged 11, from class 6b meet cases from the digital world: a photo from the internet for a
    poster, a visit from people at work and an AI that can write homework. You learn what you may do with other people's
    work, where computing is part of everyday life and work, and what the opportunities and risks of AI are. At the end
    of each case you make your own judgement on the judgement scale.
languages: [de, en]
chapters: [ich]
