<!-- Skizze der Datenspur (ab Kapitel 2, Komponente Datenspur, Texte als Props). Nicht in Welle 1 gebaut. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="sans-serif" font-size="13">
  <rect width="720" height="260" fill="#fbf8f1"/>
  <text x="20" y="28" font-weight="bold">Mias Datenspur  ·  bekannt: 6 Angaben</text>
  <!-- Figur links (use #mia aus klasse-6b.svg), dann Fußabdrücke, jeder eine Angabe -->
  <circle cx="60" cy="130" r="40" fill="#7b4fb8" stroke="#333" stroke-width="2"/><text x="60" y="135" text-anchor="middle" fill="#fff">Mia</text>
  <g stroke="#333" stroke-width="2">
    <ellipse cx="160" cy="110" rx="34" ry="22" fill="#e3d4f5"/><ellipse cx="250" cy="150" rx="34" ry="22" fill="#e3d4f5"/>
    <ellipse cx="340" cy="110" rx="34" ry="22" fill="#fde3c4"/><ellipse cx="430" cy="150" rx="34" ry="22" fill="#fde3c4"/>
    <ellipse cx="520" cy="110" rx="34" ry="22" fill="#cfe8e4"/><ellipse cx="610" cy="150" rx="34" ry="22" fill="#cfe8e4" stroke-dasharray="5 3"/>
  </g>
  <g text-anchor="middle" font-size="11"><text x="160" y="114">Name</text><text x="250" y="154">Alter 11</text><text x="340" y="114">Foto</text><text x="430" y="154">Schule</text><text x="520" y="114">Spiel-Name</text><text x="610" y="154">Standort (neu)</text></g>
  <text x="20" y="210">Farbe und Form je Art: lila = Steckbrief (Anmelden), orange = Posten, blaugrün = Spielen; Rand gestrichelt = neu in diesem Kapitel.</text>
  <text x="20" y="230">Die Spur wächst je Kapitel (Kap. 2: Anmelden, Posten, Spielen; Kap. 3: Chat, Suche; Kap. 4: alle Spuren der Klasse in einer Datenbank).</text>
  <text x="20" y="250">Tastatur/Screenreader: geordnete Liste der Angaben mit Art und Kapitel; nojs: dieselbe Liste.</text>
</svg>
