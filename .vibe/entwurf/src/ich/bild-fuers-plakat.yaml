# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title:
  de: Ein Bild fürs Plakat
  en: A picture for the poster
description:
  de: "Fremde Bilder nutzen: mit Erlaubnis oder freier Lizenz, mit Quellenangabe. Was in der Klasse geht und was im Internet. Das erste Urteil auf der Urteilsskala."
  en: "Using other people's pictures: with permission or a free licence, with a credit. What is fine in class and what is fine online. The first judgement on the judgement scale."
competencies: [urheberrecht]
blocks:
  - type: section
    id: einstieg
    title:
      de: Drei Fotos vom See
      en: Three photos of the lake
    blocks:
      - type: labelled-figure
        image: images/plakat-szene.svg
        source: { de: eigene Zeichnung, en: own drawing }
        licence: CC-BY-4.0
        alt:
          de: Links Selin mit einem Tablet, darauf ein Foto von einem See. In der Mitte ein Plakat mit einem leeren Rahmen und einem gemalten Zug. Rechts Mia mit einem Stift.
          en: On the left Selin with a tablet showing a photo of a lake. In the middle a poster with an empty frame and a painted train. On the right Mia with a pen.
        caption:
          de: Selin und Mia am Plakat „Klassenfahrt zum Seeberg“. Ins leere Feld soll ein Foto vom See.
          en: Selin and Mia at the poster “Class trip to the Seeberg”. A photo of the lake is meant to go into the empty frame.
        labels:
          - { x: 26, y: 60, marker: A, text: { de: Foto aus der Bildersuche, en: photo from a picture search } }
          - { x: 52, y: 28, marker: B, text: { de: Platz für das Foto, en: space for the photo } }
          - { x: 58, y: 64, marker: C, text: { de: Mias Zeichnung, en: Mia's drawing } }
      - type: text
        text:
          de: |
            Auf der letzten Seite hast du gelernt: Das Foto gehört nicht Selin. Die Fotografin entscheidet, was damit
            passieren darf. Die Bildersuche zeigt Selin drei Fotos vom See. Unter jedem steht etwas anderes.

            Auf dieser Seite lernst du, wann du ein fremdes Bild nutzen darfst und wie du die Quelle angibst.
          en: |
            On the last page you learned: the photo does not belong to Selin. The photographer decides what may happen
            to it. The picture search shows Selin three photos of the lake. Each one has a different note under it.

            On this page you learn when you may use someone else's picture and how to give the source.
      - type: table
        caption:
          de: Die drei Fotos und was darunter steht (alle Namen erfunden)
          en: The three photos and the notes under them (all names made up)
        header:
          - { de: Foto, en: Photo }
          - { de: Darunter steht, en: The note says }
        rowHeaders: true
        rows:
          - - { de: "1 „Seeberg im Sommer“", en: "1 “Seeberg in summer”" }
            - { de: "© Lena Vogt, alle Rechte vorbehalten", en: "© Lena Vogt, all rights reserved" }
          - - { de: "2 „Steg am See“", en: "2 “Jetty on the lake”" }
            - { de: "Karim Haddad, Lizenz CC BY 4.0", en: "Karim Haddad, licence CC BY 4.0" }
          - - { de: "3 „Seeufer am Morgen“", en: "3 “Lakeside in the morning”" }
            - { de: "Pia Brandt, CC0", en: "Pia Brandt, CC0" }
      - type: single-choice
        id: welches-foto-nicht
        text:
          de: Die Klasse will das Plakat auch auf der Schulhomepage zeigen. Welches Foto darf Selin dafür auf keinen Fall ohne Nachfrage nehmen?
          en: The class also wants to show the poster on the school website. Which photo must Selin not use for that without asking?
        options:
          - text: { de: "Foto 1, „alle Rechte vorbehalten“", en: "Photo 1, “all rights reserved”" }
            correct: true
            info:
              de: Lena Vogt behält alle Rechte. Ohne ihre Erlaubnis darf das Foto nicht ins Internet.
              en: Lena Vogt keeps all the rights. Without her permission the photo must not go online.
          - text: { de: "Foto 2, „CC BY 4.0“", en: "Photo 2, “CC BY 4.0”" }
            correct: false
            info:
              de: Karim Haddad hat schon allen etwas erlaubt. Was genau, liest du unten bei „Freie Lizenzen“.
              en: Karim Haddad has already given everyone permission for something. What exactly, you read below under “Free licences”.
          - text: { de: "Foto 3, „CC0“", en: "Photo 3, “CC0”" }
            correct: false
            info:
              de: Pia Brandt hat ihr Foto für alle freigegeben. Was CC0 heißt, liest du unten.
              en: Pia Brandt has made her photo free for everyone. You read below what CC0 means.
        explanation:
          de: „Alle Rechte vorbehalten“ heißt, dass die Fotografin über jede Nutzung selbst entscheidet. Dafür muss man sie fragen.
          en: “All rights reserved” means that the photographer decides every use herself. You have to ask her.
  - type: section
    id: idee
    title:
      de: Wann du ein fremdes Bild nutzen darfst
      en: When you may use someone else's picture
    blocks:
      - type: text
        text:
          de: |
            Du darfst ein fremdes Bild nutzen, wenn die Urheberin es dir erlaubt. Dafür gibt es zwei Wege:

            - **Du fragst** die Urheberin und sie sagt Ja. Frag dafür einen Erwachsenen, er hilft dir beim Schreiben.
            - **Sie hat es schon allen erlaubt**, mit einer freien Lizenz.
          en: |
            You may use someone else's picture if its creator allows you to. There are two ways:

            - **You ask** the creator and she says yes. Ask an adult to help you write to her.
            - **She has already allowed everyone**, with a free licence.
      - type: definition
        term: { de: freie Lizenz, en: free licence }
        explanation:
          de: Eine Erlaubnis für alle, die die Urheberin zu ihrem Werk schreibt. Bekannt sind die Creative-Commons-Lizenzen, kurz CC.
          en: A permission for everyone that the creator adds to her work. Well-known ones are the Creative Commons licences, CC for short.
      - type: table
        caption:
          de: Zwei freie Lizenzen und was du dann tun musst
          en: Two free licences and what you must do then
        header:
          - { de: Lizenz, en: Licence }
          - { de: Du musst, en: You must }
        rowHeaders: true
        rows:
          - - { de: CC BY, en: CC BY }
            - { de: "den Namen der Urheberin nennen, die Lizenz verlinken und sagen, ob du etwas geändert hast", en: "name the creator, link to the licence and say whether you changed anything" }
          - - { de: CC0, en: CC0 }
            - { de: "nichts: Das Werk ist für alle frei", en: "nothing: the work is free for everyone" }
      - type: definition
        term: { de: Quellenangabe, en: credit }
        explanation:
          de: "Ein kurzer Text beim Bild: Titel, Urheberin, Quelle (wo du es gefunden hast) und Lizenz."
          en: "A short text next to the picture: title, creator, source (where you found it) and licence."
      - type: note
        title: { de: "In der Klasse oder im Internet?", en: "In class or online?" }
        blocks:
          - type: text
            text:
              de: |
                **In der Klasse und zum Zeigen in deiner Schule** darfst du für den Unterricht ein fremdes Bild nutzen.
                Gib die Quelle an. Das erlaubt das Urheberrechtsgesetz in § 60a.

                **Im Internet**, auch auf der Schulhomepage, brauchst du eine Erlaubnis oder eine freie Lizenz.
                Bist du nicht sicher, frag deine Lehrerin oder deinen Lehrer.
              en: |
                **In class and to show in your school** you may use someone else's picture for your lessons. Give the
                source. German copyright law allows this in section 60a.

                **Online**, also on the school website, you need permission or a free licence. If you are not sure,
                ask your teacher.
  - type: section
    id: urteil
    title:
      de: Die Urteilsskala
      en: The judgement scale
    blocks:
      - type: text
        text:
          de: |
            Am Ende jedes Falls fällst du ein **Urteil**: Ist das in Ordnung? Dafür hat jeder Fall eine Skala mit fünf
            Stufen, von 1 „geht nicht“ bis 5 „ist okay“. Erst prüfst du jeden Grund: Zählt er dafür, dagegen oder gar
            nicht? Dann wählst du die Stufe, die zu den Gründen passt. Oft passen mehrere Stufen. Hier legt das Gesetz
            fest, was geht.
          en: |
            At the end of each case you make a **judgement**: is it okay? For this, every case has a scale with five
            steps, from 1 “not okay” to 5 “okay”. First you check each reason: does it count for, against or not at
            all? Then you choose the step that fits the reasons. Often several steps fit. Here the law decides what is
            allowed.
      - type: vue-component
        component: Urteilsskala
        props:
          name: { de: Urteilsskala, en: judgement scale }
          stufen:
            - { de: geht nicht, en: not okay }
            - { de: eher nicht, en: rather not }
            - { de: kommt darauf an, en: it depends }
            - { de: eher okay, en: rather okay }
            - { de: ist okay, en: okay }
          fall:
            de: "Ein Beispiel: Selin hängt Foto 2 mit Quellenangabe an das Plakat im Klassenzimmer."
            en: "An example: Selin puts photo 2 with a credit on the poster in the classroom."
          zeiger: 5
          zeigerText: { de: Urteil, en: judgement }
          dafuerTitel: { de: Gründe dafür, en: Reasons for }
          dafuer:
            - { de: Die Lizenz CC BY erlaubt es., en: The CC BY licence allows it. }
            - { de: Selin nennt den Namen und die Lizenz., en: Selin gives the name and the licence. }
          dagegenTitel: { de: Gründe dagegen, en: Reasons against }
          dagegen:
            - { de: keine, en: none }
        nojs:
          de: |
            Die Urteilsskala hat fünf Stufen: 1 geht nicht, 2 eher nicht, 3 kommt darauf an, 4 eher okay, 5 ist okay.
            Beispiel: Selin hängt Foto 2 mit Quellenangabe an das Plakat im Klassenzimmer. Urteil: Stufe 5. Gründe
            dafür: Die Lizenz CC BY erlaubt es. Selin nennt den Namen und die Lizenz. Gründe dagegen: keine.
          en: |
            The judgement scale has five steps: 1 not okay, 2 rather not, 3 it depends, 4 rather okay, 5 okay.
            Example: Selin puts photo 2 with a credit on the poster in the classroom. Judgement: step 5. Reasons for:
            the CC BY licence allows it. Selin gives the name and the licence. Reasons against: none.
  - type: section
    id: uebung
    title:
      de: Übung
      en: Practice
    blocks:
      - type: matching
        id: was-du-tun-musst
        text:
          de: Was steht unter dem Foto, und was musst du dann tun? Ordne zu.
          en: What does the note under the photo say, and what must you do then? Match them up.
        pairs:
          - left: { de: alle Rechte vorbehalten, en: all rights reserved }
            right: { de: die Urheberin um Erlaubnis fragen, en: ask the creator for permission }
          - left: { de: CC BY 4.0, en: CC BY 4.0 }
            right: { de: "Namen nennen, Lizenz verlinken", en: "name the creator, link to the licence" }
          - left: { de: CC0, en: CC0 }
            right: { de: nichts Bestimmtes, en: nothing in particular }
        distractors:
          - { de: "nichts, weil es im Internet steht", en: "nothing, because it is on the internet" }
        hint:
          de: Lies noch einmal die Tabelle „Zwei freie Lizenzen“. Ohne freie Lizenz bleibt nur die Frage nach der Erlaubnis.
          en: Read the table “Two free licences” again. Without a free licence, the only way is to ask for permission.
        explanation:
          de: Ohne freie Lizenz fragst du. CC BY verlangt Name und Lizenz. CC0 macht das Werk für alle frei. Dass ein Bild im Internet steht, erlaubt noch nichts.
          en: Without a free licence you ask. CC BY asks for the name and the licence. CC0 makes the work free for everyone. Being on the internet does not allow anything yet.
      - type: single-choice
        id: quellenangabe
        text:
          de: Selin nimmt Foto 2. Welche Quellenangabe ist vollständig?
          en: Selin takes photo 2. Which credit is complete?
        options:
          - text:
              de: "„Steg am See“ von Karim Haddad, aus der Bildersuche, Lizenz CC BY 4.0"
              en: "“Jetty on the lake” by Karim Haddad, from the picture search, licence CC BY 4.0"
            correct: true
            info:
              de: Titel, Urheber, Quelle und Lizenz sind alle da.
              en: Title, creator, source and licence are all there.
          - text: { de: "Foto: Internet", en: "Photo: internet" }
            correct: false
            info:
              de: Es fehlen Titel, Urheber und Lizenz. „Internet“ sagt nicht, wo genau du das Foto gefunden hast.
              en: Title, creator and licence are missing. “Internet” does not say where exactly you found the photo.
          - text: { de: "„Steg am See“ von Karim Haddad", en: "“Jetty on the lake” by Karim Haddad" }
            correct: false
            info:
              de: Es fehlen Quelle und Lizenz. CC BY verlangt, dass du die Lizenz nennst.
              en: Source and licence are missing. CC BY asks you to name the licence.
        explanation:
          de: "Eine vollständige Quellenangabe hat vier Teile: Titel, Urheber, Quelle und Lizenz."
          en: "A complete credit has four parts: title, creator, source and licence."
      - type: multiple-choice
        id: wo-darf-foto-1-hin
        text:
          de: Frau Berg erlaubt Foto 1 für den Unterricht. Lena Vogt hat sie nicht gefragt. Wo darf das Plakat mit Foto 1 und Quellenangabe hängen? Wähle alle passenden aus.
          en: Ms Berg allows photo 1 for the lesson. Lena Vogt has not been asked. Where may the poster with photo 1 and a credit hang? Choose all that fit.
        options:
          - text: { de: im Klassenzimmer der 6b, en: in the classroom of class 6b }
            correct: true
            info:
              de: Für den Unterricht in der Klasse ist das erlaubt.
              en: This is allowed for lessons in class.
          - text: { de: im Flur der Schule, wo die Klassen ihre Plakate zeigen, en: in the school corridor where the classes show their posters }
            correct: true
            info:
              de: Zum Zeigen der Ergebnisse in deiner Schule ist das auch erlaubt.
              en: Showing your results in your school is allowed too.
          - text: { de: auf der Schulhomepage, en: on the school website }
            correct: false
            info:
              de: Die Schulhomepage ist im Internet. Dafür braucht Selin die Erlaubnis von Lena Vogt.
              en: The school website is online. For that Selin needs Lena Vogt's permission.
          - text: { de: über einen Link, den Selin mit allen teilt, en: in a public link that Selin shares with everyone }
            correct: false
            info:
              de: Ein Link für alle bringt das Foto ins Internet. Das ist mehr als Unterricht.
              en: A link for everyone puts the photo online. That is more than a lesson.
        explanation:
          de: In der Klasse und zum Zeigen in deiner Schule geht es für den Unterricht. Im Internet nur mit Erlaubnis oder freier Lizenz.
          en: In class and to show in your school it is fine for lessons. Online only with permission or a free licence.
      - type: true-false
        id: cc0-name
        text:
          de: "Bei einem Foto mit CC0 musst du um Erlaubnis fragen."
          en: "For a photo with CC0 you have to ask for permission."
        answer: false
        hint:
          de: Lies noch einmal, was in der Tabelle bei CC0 steht.
          en: Read again what the table says about CC0.
        explanation:
          de: Mit CC0 hat die Urheberin ihr Werk für alle freigegeben. Du musst nicht fragen. Den Namen zu nennen ist trotzdem nett.
          en: With CC0 the creator has made her work free for everyone. You do not have to ask. Giving her name is still nice.
      - type: text
        text:
          de: "Jetzt dein erstes Urteil. Die Klasse möchte das Plakat zeigen, und Foto 1 gefällt allen am besten."
          en: "Now your first judgement. The class wants to show the poster, and everyone likes photo 1 best."
      - type: vue-component
        component: UrteilAufgabe
        props:
          fall:
            de: "Fall: Selin stellt das Plakat mit Foto 1 („alle Rechte vorbehalten“) auf die Schulhomepage. Lena Vogt hat sie nicht gefragt."
            en: "Case: Selin puts the poster with photo 1 (“all rights reserved”) on the school website. She has not asked Lena Vogt."
          stufen:
            - { de: geht nicht, en: not okay }
            - { de: eher nicht, en: rather not }
            - { de: kommt darauf an, en: it depends }
            - { de: eher okay, en: rather okay }
            - { de: ist okay, en: okay }
          gruende:
            - text:
                de: Lena Vogt hat nicht erlaubt, dass ihr Foto ins Internet kommt.
                en: Lena Vogt has not allowed her photo to go online.
              zaehlt: dagegen
              warum:
                de: Die Urheberin entscheidet, ob ihr Werk ins Internet darf. Ohne ihre Erlaubnis spricht das gegen Selins Plan.
                en: The creator decides whether her work may go online. Without her permission, this speaks against Selin's plan.
            - text:
                de: Foto 1 ist das schönste Foto vom See.
                en: Photo 1 is the nicest photo of the lake.
              zaehlt: dafuer
              warum:
                de: Ein schönes Foto ist ein echter Wunsch und spricht dafür. Gegen das fehlende Ja der Urheberin wiegt er aber wenig.
                en: A nice photo is a real wish and speaks for it. But it weighs little against the creator's missing yes.
            - text:
                de: Im Internet machen das doch alle so.
                en: Everyone does it like this online.
              zaehlt: nicht
              warum:
                de: Was viele tun, ist deshalb nicht erlaubt. Das ist kein Grund, weder dafür noch dagegen.
                en: What many people do is not allowed just because of that. It is no reason, neither for nor against.
            - text:
                de: Mit Foto 2 (CC BY) gäbe es ein erlaubtes Foto vom See.
                en: Photo 2 (CC BY) would be an allowed photo of the lake.
              zaehlt: dagegen
              warum:
                de: Es gibt einen erlaubten Weg. Darum gibt es keinen Grund, das Recht von Lena Vogt zu übergehen.
                en: There is an allowed way. So there is no reason to ignore Lena Vogt's rights.
          erlaubt: [1, 2]
          gruendeTitel: { de: "Wie zählt jeder Grund?", en: "How does each reason count?" }
          skalaTitel: { de: "Dein Urteil: Wie okay ist Selins Plan?", en: "Your judgement: how okay is Selin's plan?" }
          dafuer: { de: zählt dafür, en: counts for }
          dagegen: { de: zählt dagegen, en: counts against }
          nicht: { de: zählt nicht, en: does not count }
          positionFalsch:
            de: "Stufe {stufe} „{wort}“ passt nicht: Ohne Erlaubnis darf das Foto nicht ins Internet. Das Gesetz entscheidet hier, ein schönes Foto ändert daran nichts."
            en: "Step {stufe} “{wort}” does not fit: without permission the photo must not go online. The law decides here, and a nice photo does not change that."
          fehltGrund: { de: Ordne erst jeden Grund ein., en: First sort every reason. }
          fehltStufe: { de: Wähle eine Stufe auf der Skala., en: Choose a step on the scale. }
        examples:
          accepted:
            - { answer: { stufe: 1, einordnung: [dagegen, dafuer, nicht, dagegen] }, seed: 1 }
            - { answer: { stufe: 2, einordnung: [dagegen, dafuer, nicht, dagegen] }, seed: 1 }
          rejected:
            - { answer: { stufe: 4, einordnung: [dagegen, dafuer, nicht, dagegen] }, seed: 1 }
            - { answer: { stufe: 1, einordnung: [dagegen, dafuer, dafuer, dagegen] }, seed: 1 }
      - type: text
        text:
          de: |
            Erklär dein Urteil jemandem neben dir: Welcher Grund wiegt am meisten?

            Damit ist Fall 1 entschieden. Im nächsten Fall besucht die 6b Menschen, die bei der Arbeit Computer nutzen.
          en: |
            Explain your judgement to someone next to you: which reason weighs most?

            That settles case 1. In the next case, class 6b visits people who use computers at work.
